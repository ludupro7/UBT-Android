name: Build APK

# Builds the debug APK on GitHub's runners (this VM cannot run Gradle,
# so the build happens here instead). Triggers on every push to main and
# manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: setup-android's default packages are "tools platform-tools",
      # but Google removed the legacy "tools" package from its repository,
      # so the default fails with "Failed to find package 'tools'".
      # Override with platform-tools only; platform/build-tools/NDK are
      # installed in the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # The app's preBuild hook already runs `cargo ndk ... build --release`
      # (see app/build.gradle.kts), so assembleDebug builds both the Rust
      # native library and the APK. Gradle 8.9 is installed directly here
      # instead of using the wrapper, so gradle-wrapper.jar is not needed.
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
